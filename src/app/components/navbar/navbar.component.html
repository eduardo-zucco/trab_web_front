<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm sticky-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" routerLink="/" (click)="closeMenu()">
      <i class="bi bi-check2-circle fs-4"></i>
      <span>Trabalho Web</span>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      (click)="toggleMenu()"
      aria-controls="mainNavbar"
      [attr.aria-expanded]="isMenuOpen"
      aria-label="Alternar navegação"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="isMenuOpen" id="mainNavbar">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        @for (link of navLinks; track link.path) {
          <li class="nav-item">
            <a
              class="nav-link d-flex align-items-center gap-1.5"
              [routerLink]="link.path"
              routerLinkActive="active fw-semibold"
              [routerLinkActiveOptions]="{ exact: link.path === '/' }"
              (click)="closeMenu()"
            >
              <i class="bi" [class]="link.icon"></i>
              <span>{{ link.label }}</span>
            </a>
          </li>
        }
      </ul>

      <div class="d-flex align-items-center gap-3 pt-2 pt-lg-0 border-top border-lg-0 border-light-subtle">
        @if (currentUser) {
          <div class="text-white-50 small d-none d-xl-block">
            Olá, <strong class="text-white">{{ currentUser.name }}</strong>
          </div>
        }
        <button
          type="button"
          (click)="logout()"
          class="btn btn-outline-light btn-sm d-flex align-items-center gap-1"
          title="Encerrar sessão"
        >
          <i class="bi bi-box-arrow-right"></i>
          <span>Sair</span>
        </button>
      </div>
    </div>
  </div>
</nav>
