<header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a routerLink="/" class="flex items-center gap-2 group">
        <!-- <div class="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold shadow-md shadow-indigo-200 group-hover:bg-indigo-700 transition">
          <i class="bi bi-layers-fill text-lg"></i>
        </div> -->  
        <span class="font-semibold text-slate-900 text-lg tracking-tight">Trabalho Web</span>
      </a>

    </div>

    <nav class="flex items-center gap-1">
      @for (link of navLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="text-indigo-600 bg-indigo-50 font-medium"
          [routerLinkActiveOptions]="{ exact: true }"
          class="px-3 py-1.5 rounded-md text-sm text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition"
        >
          {{ link.label }}
        </a>
      }
      <button (click)="logout()" class="px-3 py-1.5 rounded-md text-sm text-red-600 hover:text-red-900 hover:bg-red-100 transition" >Sair</button>
    </nav>
  </div>
</header>
