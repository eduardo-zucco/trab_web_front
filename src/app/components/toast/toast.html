<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1090;">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="toast show align-items-center border-0 shadow-sm toast-animate mb-2"
      [class.text-bg-success]="toast.type === 'success'"
      [class.text-bg-warning]="toast.type === 'warning'"
      [class.text-bg-danger]="toast.type === 'error'"
      [class.text-bg-info]="toast.type === 'info'"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
    >
      <div class="d-flex">
        <div class="toast-body d-flex align-items-center gap-2">
          @switch (toast.type) {
            @case ('success') {
              <i class="bi bi-check-circle-fill fs-5" aria-hidden="true"></i>
            }
            @case ('warning') {
              <i class="bi bi-exclamation-triangle-fill fs-5 text-dark" aria-hidden="true"></i>
            }
            @case ('error') {
              <i class="bi bi-x-circle-fill fs-5" aria-hidden="true"></i>
            }
            @case ('info') {
              <i class="bi bi-info-circle-fill fs-5" aria-hidden="true"></i>
            }
          }
          <div class="fw-medium text-break" [class.text-dark]="toast.type === 'warning'">
            {{ toast.message }}
          </div>
        </div>
        <button
          type="button"
          (click)="toastService.remove(toast.id)"
          class="btn-close me-2 m-auto"
          [class.btn-close-white]="toast.type !== 'warning'"
          aria-label="Fechar notificação"
        ></button>
      </div>
    </div>
  }
</div>
